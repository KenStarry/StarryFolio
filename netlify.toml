# Netlify deploy for the static build.
#
# Two things have to exist before `jaspr build` runs:
#   1. the Dart SDK — `DART_VERSION` below drives the install step
#   2. the standalone Tailwind CLI, which jaspr_tailwind shells out to as
#      `tailwindcss`. Without it the build still "succeeds" but ships an
#      empty stylesheet, so it is pinned rather than tracking latest.
[build]
  publish = "build/jaspr"
  command = """
    set -e
    curl -sL https://storage.googleapis.com/dart-archive/channels/stable/release/$DART_VERSION/sdk/dartsdk-linux-x64-release.zip -o dart.zip
    unzip -q dart.zip -d "$HOME"
    curl -sL https://github.com/tailwindlabs/tailwindcss/releases/download/v$TAILWIND_VERSION/tailwindcss-linux-x64 -o "$HOME/tailwindcss"
    chmod +x "$HOME/tailwindcss"
    export PATH="$HOME/dart-sdk/bin:$HOME:$PATH"
    dart pub global activate jaspr_cli
    export PATH="$PATH:$HOME/.pub-cache/bin"
    jaspr build --sitemap-domain https://kenstarry.com
  """

[build.environment]
  DART_VERSION = "3.12.2"
  TAILWIND_VERSION = "4.3.3"

[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404
