include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Generated by jaspr_builder on first run.
    - "lib/*.options.dart"
    # `jaspr build` output — not ours to lint.
    - "build/**"
  errors:
    todo: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
