# Cloudflare Pages project config.
#
# Only the build *output* is declared here — the build command itself lives in
# `scripts/build.sh` and is set in the Pages dashboard, because Cloudflare runs
# it before this file is ever read.
name = "kenstarry"
pages_build_output_dir = "build/jaspr"

# Pins the Workers runtime API surface the contact function is written against.
# Without it Cloudflare picks a date at deploy time and behaviour can drift.
compatibility_date = "2026-08-26"
