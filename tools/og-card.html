<!--
  Source for web/images/og.jpg — the 1200x630 social share card.

  Regenerate after changing the palette, the avatar or the tagline:

    AV=$(base64 < web/images/ken-avatar.webp | tr -d '\n')
    # (re-inline the avatar into the <img src> below if it changed)
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot=/tmp/og_2x.png "file://$PWD/tools/og-card.html"
    sips -z 630 1200 /tmp/og_2x.png --out /tmp/og.png
    sips -s format jpeg -s formatOptions 82 /tmp/og.png --out web/images/og.jpg

  Rendered at 2x and downscaled so the type antialiases cleanly. JPEG because
  the avatar is photographic; the same card is 92 KB here against 347 KB as a
  PNG. The avatar is inlined as a data URI so the render has no network
  dependency beyond the Google Fonts stylesheet.
-->

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#282739;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;position:relative}
  /* Single accent bloom, same as the hero. */
  .bloom{position:absolute;right:-80px;top:-120px;width:760px;height:760px;
    background:radial-gradient(closest-side,rgba(139,143,245,.26),transparent 78%)}
  .wrap{position:relative;display:flex;height:100%;align-items:center;padding:0 76px;gap:40px}
  .copy{flex:1;min-width:0;position:relative;z-index:2}
  .eyebrow{display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono',monospace;
    font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#8a8ea8}
  .eyebrow i{display:block;width:26px;height:1px;background:#8b8ff5}
  h1{margin-top:24px;font-size:104px;font-weight:800;line-height:.94;letter-spacing:-.04em;color:#e9ebf7}
  .mark{display:flex;gap:8px;margin-top:30px}
  .mark b{display:block;height:6px;width:72px;background:#a5a8ff;box-shadow:0 0 16px rgba(165,168,255,.55)}
  .mark i{display:block;height:6px;width:14px;background:#6f74e8}
  p{margin-top:28px;font-size:25px;line-height:1.4;font-weight:600;color:#d0d4ed;max-width:505px}
  .foot{position:absolute;left:72px;bottom:52px;display:flex;align-items:center;gap:16px;
    font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.16em;
    text-transform:uppercase;color:#8a8ea8}
  .foot s{display:block;width:1px;height:14px;background:#4e5166}
  .foot em{font-style:normal;color:#a5a8ff}
  /* Card stack, mirroring the hero's fanned layers. */
  .ghost{position:absolute;right:-30px;top:50%;transform:translateY(-50%);
    font-size:230px;font-weight:800;letter-spacing:-.05em;line-height:.8;
    color:rgba(233,235,247,.042);white-space:nowrap;z-index:1;pointer-events:none}
  .stack{position:relative;width:430px;height:430px;flex:none;z-index:2}
  .stack .l{position:absolute;inset:0;border:1px solid #434659;background:#2e2d3f;border-radius:3px}
  .l1{transform:translate(-14px,9px) rotate(-5deg)}
  .l2{transform:translate(-7px,4px) rotate(-2.5deg)}
  .front{position:absolute;inset:0;border:1px solid #4e5166;background:#2e2d3f;
    border-radius:3px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.75)}
  .front img{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block}
  .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
    padding:12px 16px;border-top:1px solid rgba(67,70,89,.8);background:rgba(40,39,57,.92);
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .cap u{text-decoration:none;color:#a9adc6}.cap v{color:#a5a8ff}
</style></head><body>
