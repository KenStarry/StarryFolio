<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ken Starry, Flutter and Mobile App Developer in Nairobi, Kenya">
  <title>Ken Starry · Flutter &amp; Mobile App Developer</title>

  <!--
    The GitHub profile banner, built from this site's own design tokens rather
    than from a banner generator: ink palette, the ghost-wordmark motif, the
    two-tone display title and a drawn hairline. It is hosted here, not in the
    profile repo, so it cannot drift away from the tokens it borrows.

    Fonts are a system stack on purpose. GitHub proxies this through camo and
    renders it as an <img>, so a webfont would never load and the text would
    silently reflow into a fallback nobody chose.

    Note for future edits: camo caches aggressively. Change the FILENAME
    (gh-banner-2.svg) rather than the contents, or the profile keeps showing
    the old art for days.
  -->

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282739"/>
      <stop offset="1" stop-color="#1E1F2B"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="14"/></clipPath>
  </defs>

  <style>
    .f  { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

    /* The un-animated state is the visible one, so a renderer that ignores
       CSS shows a finished banner rather than an empty rectangle. `backwards`
       supplies the hidden start only while the animation is actually running. */
    .rise { animation: rise .9s cubic-bezier(.2,.7,.3,1) backwards; }
    .d1 { animation-delay: .05s } .d2 { animation-delay: .16s }
    .d3 { animation-delay: .27s } .d4 { animation-delay: .38s }
    .d5 { animation-delay: .5s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    .draw { animation: draw 1.1s cubic-bezier(.2,.7,.3,1) .3s backwards; transform-origin: 72px 0; }
    @keyframes draw { from { transform: scaleX(0); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .draw { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#ground)"/>

    <!-- Ghost wordmark: texture, never content. Bleeds off the bottom-left so
         only the shoulders of the letterforms read, the way the site does it. -->
    <text class="f" x="-26" y="392" font-size="228" font-weight="800"
          letter-spacing="-8" fill="#E9EBF7" opacity="0.024">kenstarry</text>

    <!-- Identity block -->
    <text class="m rise d1" x="72" y="86" font-size="15" letter-spacing="3.5" fill="#8A8EA8">NAIROBI · KENYA</text>
    <text class="m rise d1" x="1128" y="86" text-anchor="end" font-size="15" letter-spacing="1.8" fill="#D0D4ED">kenstarry.com</text>

    <text class="f rise d2" x="72" y="176" font-size="82" letter-spacing="-1.5">
      <tspan font-weight="600" fill="#8A8EA8">Ken</tspan><tspan font-weight="800" fill="#E9EBF7"> Starry</tspan>
    </text>

    <rect class="draw" x="72" y="202" width="118" height="2.5" rx="1.25" fill="#D0D4ED"/>

    <text class="f rise d3" x="72" y="252" font-size="27" font-weight="600" fill="#D0D4ED">Flutter &amp; Mobile App Developer</text>

    <text class="f rise d4" x="72" y="292" font-size="18" font-weight="400" fill="#8A8EA8">I build apps that move, breathe, and show off a little.</text>

    <!-- Stats, in the site's own pill language -->
    <g class="rise d5">
      <line x1="906" y1="112" x2="906" y2="248" stroke="#434659" stroke-width="1"/>

      <text class="f" x="946" y="136" font-size="30" font-weight="800" fill="#E9EBF7">5+</text>
      <text class="m" x="946" y="158" font-size="12" letter-spacing="1.4" fill="#8A8EA8">YEARS IN FLUTTER</text>

      <text class="f" x="946" y="204" font-size="30" font-weight="800" fill="#E9EBF7">2</text>
      <text class="m" x="946" y="226" font-size="12" letter-spacing="1.4" fill="#8A8EA8">APP STORES SURVIVED</text>
    </g>

  </g>
</svg>
